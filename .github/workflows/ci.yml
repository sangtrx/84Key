name: CI

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  engine-tests:
    name: Core + security tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Compiler version
        run: c++ --version
      - name: Build and run engine, sanitizer, and source-invariant gates
        run: bash core/tests/run_tests.sh

  macos-app:
    name: Build macOS app + headless agent
    runs-on: macos-26
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Select exact Xcode 26.6 (17F113)
        run: |
          set -euo pipefail
          XCODE=/Applications/Xcode_26.6.app
          test -d "$XCODE" || { echo "ERROR: exact Xcode 26.6 is unavailable" >&2; exit 1; }
          sudo xcode-select -s "$XCODE/Contents/Developer"
          XCODE_VERSION="$(xcodebuild -version | sed -n '1p')"
          XCODE_BUILD="$(xcodebuild -version | sed -n '2p')"
          test "$XCODE_VERSION" = "Xcode 26.6"
          test "$XCODE_BUILD" = "Build version 17F113"
          xcodebuild -version

      - name: Smoke-test release credential decoder
        run: |
          set -euo pipefail
          test "$(printf 'U2FuZ0tleQ==' | /usr/bin/base64 -D)" = "SangKey"

      - name: Install verified XcodeGen 2.46.0
        env:
          XCODEGEN_URL: https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip
          XCODEGEN_SHA256: 4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806
        run: |
          set -euo pipefail
          ZIP="$RUNNER_TEMP/xcodegen.zip"
          DEST="$RUNNER_TEMP/xcodegen"
          curl --fail --location --proto '=https' --tlsv1.2 "$XCODEGEN_URL" -o "$ZIP"
          printf '%s  %s\n' "$XCODEGEN_SHA256" "$ZIP" | shasum -a 256 -c -
          mkdir -p "$DEST"
          unzip -q "$ZIP" -d "$DEST"
          BIN=$(find "$DEST" -type f -name xcodegen -perm -111 -print -quit)
          [ -n "$BIN" ] || { echo "ERROR: xcodegen executable missing" >&2; exit 1; }
          echo "$(dirname "$BIN")" >> "$GITHUB_PATH"
          "$BIN" --version

      - name: Generate Xcode project
        working-directory: platform/macos
        run: xcodegen generate

      - name: Build launcher and headless agent without code signing
        working-directory: platform/macos
        run: |
          set -euo pipefail
          xcodebuild \
            -project SangKey.xcodeproj \
            -scheme SangKey \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Verify split linkage and always-on agent footprint
        run: |
          set -euo pipefail
          APP=$(find "$HOME/Library/Developer/Xcode/DerivedData" -path '*/Build/Products/Debug/SangKey (DEV).app' -print -quit)
          test -n "$APP"
          LAUNCHER_ENTRY="$APP/Contents/MacOS/SangKey (DEV)"
          LAUNCHER_REAL="$APP/Contents/MacOS/SangKey (DEV).debug.dylib"
          AGENT="$APP/Contents/Resources/SangKeyAgent"
          AGENT_PLIST="$APP/Contents/Library/LaunchAgents/com.sangtrx.sangkey.agent.plist"
          COMMON="$APP/Contents/Resources/english_common_cc0.json"
          SUPPLEMENT="$APP/Contents/Resources/english_supplement.dat"
          test -x "$LAUNCHER_ENTRY"
          test -f "$LAUNCHER_REAL"
          test -x "$AGENT"
          test -f "$AGENT_PLIST"
          test -f "$COMMON"
          test -f "$SUPPLEMENT"
          test ! -e "$APP/Contents/Resources/english_words.dat"
          test "$(git hash-object "$COMMON")" = '8ec4ea53704dfca63f1ee00852c6bcc15411c49e'
          plutil -lint "$AGENT_PLIST"
          test "$(/usr/libexec/PlistBuddy -c 'Print :BundleProgram' "$AGENT_PLIST")" = 'Contents/Resources/SangKeyAgent'

          echo "== launcher linked images =="
          otool -L "$LAUNCHER_REAL"
          if otool -L "$LAUNCHER_REAL" | grep -Eqi 'SwiftUI|Combine|/libswift'; then
            echo "ERROR: ephemeral launcher linked Swift runtime machinery" >&2
            exit 1
          fi
          otool -L "$LAUNCHER_REAL" | grep -q '/AppKit.framework/'
          otool -L "$LAUNCHER_REAL" | grep -q '/ServiceManagement.framework/'

          echo "== always-on agent linked images =="
          otool -L "$AGENT"
          if otool -L "$AGENT" | grep -Eqi 'AppKit|SwiftUI|Combine|/libswift|ServiceManagement'; then
            echo "ERROR: always-on SangKeyAgent linked UI/Swift/login-item machinery" >&2
            exit 1
          fi
          test ! -e "$APP/Contents/Resources/EngineUpstream.inc"
          test -z "$(find platform/macos/App platform/macos/Agent platform/macos/Shared platform/macos/HeadlessCompat -type f -name '*.swift' -print 2>/dev/null || true)"

          echo "== static footprint =="
          echo "Debug app: $(du -sk "$APP" | awk '{print $1}') KiB"
          echo "Debug agent: $(stat -f '%z' "$AGENT") bytes"

          echo "== headless agent idle footprint =="
          LOG="$RUNNER_TEMP/sangkey-agent-idle.log"
          SANGKEY_AGENT_CI_SMOKE=1 "$AGENT" >"$LOG" 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT
          sleep 3
          if ! kill -0 "$PID" 2>/dev/null; then
            cat "$LOG"
            echo "ERROR: SangKeyAgent exited during idle smoke" >&2
            exit 1
          fi
          cat "$LOG"
          grep -q 'dictionaries=yes; AppKit=no' "$LOG"
          RSS_KIB=$(ps -o rss= -p "$PID" | awk '{print $1}')
          CPU_PCT=$(ps -o %cpu= -p "$PID" | awk '{print $1}')
          test -n "$RSS_KIB"
          echo "SangKeyAgent idle RSS: ${RSS_KIB} KiB"
          echo "SangKeyAgent idle CPU snapshot: ${CPU_PCT}%"
          test "$RSS_KIB" -lt 30720 || {
            echo "ERROR: headless agent exceeded 30 MiB RSS budget" >&2
            exit 1
          }
          kill "$PID"
          wait "$PID" || true
          trap - EXIT

      - name: Smoke-test universal Release DMG packaging
        env:
          CODESIGN_IDENTITY: '-'
          SANGKEY_VERSION: '0.4.0'
          SANGKEY_ARCHS: 'arm64 x86_64'
          SANGKEY_SOURCE_URL: 'https://github.com/sangtrx/84Key/tree/${{ github.sha }}'
          CONFIG: Release
        run: |
          set -euo pipefail
          bash tools/package.sh

          APP="build/dd/Build/Products/Release/SangKey.app"
          BIN="$APP/Contents/MacOS/SangKey"
          AGENT="$APP/Contents/Resources/SangKeyAgent"
          AGENT_PLIST="$APP/Contents/Library/LaunchAgents/com.sangtrx.sangkey.agent.plist"
          DMG="build/SangKey.dmg"
          test -d "$APP"
          test -x "$BIN"
          test -x "$AGENT"
          test -f "$AGENT_PLIST"
          test -f "$DMG"
          test -f build/dist/LICENSE.txt
          test -f build/dist/NOTICE.txt
          test -f build/dist/THIRD_PARTY_DATA.txt
          test -f build/dist/SOURCE.txt
          grep -Fxq "$SANGKEY_SOURCE_URL" build/dist/SOURCE.txt
          grep -q '8ec4ea53704dfca63f1ee00852c6bcc15411c49e' build/dist/THIRD_PARTY_DATA.txt
          test -f "$APP/Contents/Resources/english_common_cc0.json"
          test -f "$APP/Contents/Resources/english_supplement.dat"
          test ! -e "$APP/Contents/Resources/english_words.dat"
          test "$(git hash-object "$APP/Contents/Resources/english_common_cc0.json")" = '8ec4ea53704dfca63f1ee00852c6bcc15411c49e'
          test ! -e "$APP/Contents/Frameworks/Sparkle.framework"
          test ! -e "$APP/Contents/Resources/EngineUpstream.inc"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Contents/Info.plist")" = "com.sangtrx.sangkey"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Contents/Info.plist")" = "0.4.0"
          lipo "$BIN" -verify_arch arm64 x86_64
          lipo "$AGENT" -verify_arch arm64 x86_64
          if otool -L "$AGENT" | grep -Eqi 'AppKit|SwiftUI|Combine|/libswift|ServiceManagement'; then
            echo "ERROR: Release agent linked non-headless runtime machinery" >&2
            exit 1
          fi
          echo "Launcher architectures: $(lipo "$BIN" -archs)"
          echo "Agent architectures: $(lipo "$AGENT" -archs)"
          echo "Release footprint: $(du -sk "$APP" | awk '{print $1}') KiB app; $(stat -f '%z' "$BIN") byte launcher; $(stat -f '%z' "$AGENT") byte agent"
          codesign --verify --strict --verbose=2 "$AGENT"
          test "$(codesign -d --verbose=4 "$AGENT" 2>&1 | awk -F= '/^Identifier=/{print $2; exit}')" = 'com.sangtrx.sangkey.agent'
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign --verify --verbose=2 "$DMG"
          hdiutil verify "$DMG"
          shasum -a 256 "$DMG"
