name: CI

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  engine-tests:
    name: Core + security tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Compiler version
        run: c++ --version
      - name: Build and run engine, sanitizer, and source-invariant gates
        run: bash core/tests/run_tests.sh

  macos-app:
    name: Build macOS app
    runs-on: macos-26
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Select Xcode 26
        run: |
          set -euo pipefail
          XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          [ -n "$XCODE" ] || { echo "ERROR: no Xcode 26.x found on runner" >&2; exit 1; }
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version

      - name: Smoke-test release credential decoder
        run: |
          set -euo pipefail
          test "$(printf 'U2FuZ0tleQ==' | /usr/bin/base64 -D)" = "SangKey"

      - name: Install verified XcodeGen 2.46.0
        env:
          XCODEGEN_URL: https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip
          XCODEGEN_SHA256: 4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806
        run: |
          set -euo pipefail
          ZIP="$RUNNER_TEMP/xcodegen.zip"
          DEST="$RUNNER_TEMP/xcodegen"
          curl --fail --location --proto '=https' --tlsv1.2 "$XCODEGEN_URL" -o "$ZIP"
          printf '%s  %s\n' "$XCODEGEN_SHA256" "$ZIP" | shasum -a 256 -c -
          mkdir -p "$DEST"
          unzip -q "$ZIP" -d "$DEST"
          BIN=$(find "$DEST" -type f -name xcodegen -perm -111 -print -quit)
          [ -n "$BIN" ] || { echo "ERROR: xcodegen executable missing" >&2; exit 1; }
          echo "$(dirname "$BIN")" >> "$GITHUB_PATH"
          "$BIN" --version

      - name: Generate Xcode project
        working-directory: platform/macos
        run: xcodegen generate

      - name: Build zero-Swift AppKit host without code signing
        working-directory: platform/macos
        run: |
          set -euo pipefail
          xcodebuild \
            -project SangKey.xcodeproj \
            -scheme SangKey \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Verify ultra-light runtime linkage and idle footprint
        run: |
          set -euo pipefail
          APP=$(find "$HOME/Library/Developer/Xcode/DerivedData" -path '*/Build/Products/Debug/SangKey (DEV).app' -print -quit)
          test -n "$APP"
          ENTRY="$APP/Contents/MacOS/SangKey (DEV)"
          REAL="$APP/Contents/MacOS/SangKey (DEV).debug.dylib"
          test -x "$ENTRY"
          test -f "$REAL"

          echo "== real debug payload linked images =="
          otool -L "$REAL"
          if otool -L "$REAL" | grep -Eqi 'SwiftUI|Combine|/libswift|ServiceManagement'; then
            echo "ERROR: SangKey linked Swift/SwiftUI/Combine/ServiceManagement runtime machinery" >&2
            exit 1
          fi
          test ! -e "$APP/Contents/Resources/EngineUpstream.inc"
          test -z "$(find platform/macos/App platform/macos/Bridge -type f -name '*.swift' -print 2>/dev/null || true)"

          echo "== static footprint =="
          APP_KIB=$(du -sk "$APP" | awk '{print $1}')
          REAL_BYTES=$(stat -f '%z' "$REAL")
          echo "Debug app: ${APP_KIB} KiB"
          echo "Debug real payload: ${REAL_BYTES} bytes"

          echo "== idle footprint smoke =="
          LOG="$RUNNER_TEMP/sangkey-idle.log"
          SANGKEY_CI_SMOKE=1 "$ENTRY" >"$LOG" 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT
          sleep 3
          if ! kill -0 "$PID" 2>/dev/null; then
            cat "$LOG"
            echo "ERROR: SangKey exited during idle footprint smoke" >&2
            exit 1
          fi
          RSS_KIB=$(ps -o rss= -p "$PID" | awk '{print $1}')
          CPU_PCT=$(ps -o %cpu= -p "$PID" | awk '{print $1}')
          test -n "$RSS_KIB"
          echo "SangKey idle RSS with status menu + dictionaries: ${RSS_KIB} KiB"
          echo "SangKey idle CPU snapshot: ${CPU_PCT}%"
          kill "$PID"
          wait "$PID" || true
          trap - EXIT

      - name: Smoke-test universal Release DMG packaging
        env:
          CODESIGN_IDENTITY: '-'
          SANGKEY_VERSION: '0.3.0'
          SANGKEY_ARCHS: 'arm64 x86_64'
          CONFIG: Release
        run: |
          set -euo pipefail
          bash tools/package.sh

          APP="build/dd/Build/Products/Release/SangKey.app"
          BIN="$APP/Contents/MacOS/SangKey"
          DMG="build/SangKey.dmg"
          test -d "$APP"
          test -f "$DMG"
          test ! -e "$APP/Contents/Frameworks/Sparkle.framework"
          test ! -e "$APP/Contents/Resources/EngineUpstream.inc"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Contents/Info.plist")" = "com.sangtrx.sangkey"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Contents/Info.plist")" = "0.3.0"
          lipo "$BIN" -verify_arch arm64 x86_64
          if otool -L "$BIN" | grep -Eqi 'SwiftUI|Combine|/libswift|ServiceManagement'; then
            echo "ERROR: Release binary linked non-minimal runtime machinery" >&2
            exit 1
          fi
          echo "Release architectures: $(lipo "$BIN" -archs)"
          echo "Release footprint: $(du -sk "$APP" | awk '{print $1}') KiB app; $(stat -f '%z' "$BIN") byte universal binary"
          codesign --verify --strict --verbose=2 "$APP"
          codesign --verify --verbose=2 "$DMG"
          hdiutil verify "$DMG"
          shasum -a 256 "$DMG"
