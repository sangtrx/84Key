name: CI

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  engine-tests:
    name: Core + security tests
    runs-on: ubuntu-24.04
    steps:
      # Pin actions by immutable commit SHA, not a mutable major-version tag.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Compiler version
        run: c++ --version
      - name: Build and run engine, sanitizer, and source-invariant gates
        run: bash core/tests/run_tests.sh

  macos-app:
    name: Build macOS app
    runs-on: macos-26
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Select Xcode 26
        run: |
          set -euo pipefail
          XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          [ -n "$XCODE" ] || { echo "ERROR: no Xcode 26.x found on runner" >&2; exit 1; }
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version

      # The release job decodes the Developer ID certificate and ASC key on the
      # same macOS runner family. Exercise BSD base64's real decode syntax here so
      # a GNU-only flag cannot survive until the first secret-bearing tag build.
      - name: Smoke-test release credential decoder
        run: |
          set -euo pipefail
          test "$(printf 'ODRLZXk=' | /usr/bin/base64 -D)" = "84Key"

      # Download an immutable XcodeGen release asset and verify the digest
      # published by GitHub before executing it. This avoids executing a mutable
      # Homebrew formula inside a privileged release/build environment.
      - name: Install verified XcodeGen 2.46.0
        env:
          XCODEGEN_URL: https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip
          XCODEGEN_SHA256: 4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806
        run: |
          set -euo pipefail
          ZIP="$RUNNER_TEMP/xcodegen.zip"
          DEST="$RUNNER_TEMP/xcodegen"
          curl --fail --location --proto '=https' --tlsv1.2 "$XCODEGEN_URL" -o "$ZIP"
          printf '%s  %s\n' "$XCODEGEN_SHA256" "$ZIP" | shasum -a 256 -c -
          mkdir -p "$DEST"
          unzip -q "$ZIP" -d "$DEST"
          BIN=$(find "$DEST" -type f -name xcodegen -perm -111 -print -quit)
          [ -n "$BIN" ] || { echo "ERROR: xcodegen executable missing" >&2; exit 1; }
          echo "$(dirname "$BIN")" >> "$GITHUB_PATH"
          "$BIN" --version

      - name: Generate Xcode project
        working-directory: platform/macos
        run: xcodegen generate

      - name: Build app without code signing
        working-directory: platform/macos
        run: |
          set -euo pipefail
          xcodebuild \
            -project 84Key.xcodeproj \
            -scheme 84Key \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build

      # Exercise the exact release packaging path without exposing Apple release
      # credentials. '-' is codesign's ad-hoc identity: it executes the same
      # signing/verification and DMG creation code, but cannot masquerade as a
      # distributable Developer ID build. Release artifacts are required to be
      # universal so the documented macOS 14+ support does not silently exclude
      # Intel Macs just because GitHub's macOS 26 runner is arm64.
      - name: Smoke-test universal Release DMG packaging
        env:
          CODESIGN_IDENTITY: '-'
          KEY84_VERSION: '0.2.0'
          KEY84_ARCHS: 'arm64 x86_64'
          CONFIG: Release
        run: |
          set -euo pipefail
          bash tools/package.sh

          APP="build/dd/Build/Products/Release/84Key.app"
          BIN="$APP/Contents/MacOS/84Key"
          DMG="build/84Key.dmg"
          test -d "$APP"
          test -f "$DMG"
          test ! -e "$APP/Contents/Frameworks/Sparkle.framework"
          test ! -e "$APP/Contents/Resources/EngineUpstream.inc"

          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Contents/Info.plist")" = "com.sangtrx.key84"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Contents/Info.plist")" = "0.2.0"
          lipo "$BIN" -verify_arch arm64 x86_64
          echo "Release architectures: $(lipo "$BIN" -archs)"

          codesign --verify --strict --verbose=2 "$APP"
          codesign --verify --verbose=2 "$DMG"
          hdiutil verify "$DMG"
          shasum -a 256 "$DMG"
