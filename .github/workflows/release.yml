name: Release

# Security model:
#   1. Build/sign/notarize runs with read-only repository permission and the
#      protected `release` environment secrets.
#   2. Signing material is destroyed before any artifact-upload action runs.
#   3. The signed artifact is handed to a separate publish job that has no Apple
#      credentials and receives the short-lived contents:write token.
#   4. Every reusable action is pinned to an immutable commit SHA.
#   5. XcodeGen is downloaded at an exact version and SHA-256 verified before use.
#
# This fork intentionally has no in-app auto-updater or appcast.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build-sign-notarize:
    name: Build, sign & notarize
    runs-on: macos-latest
    timeout-minutes: 45
    environment: release
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Verify exact tag checkout
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Select Xcode 26
        run: |
          set -euo pipefail
          XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          [ -n "$XCODE" ] || { echo "ERROR: no Xcode 26.x found on runner" >&2; exit 1; }
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version

      - name: Install verified XcodeGen 2.46.0
        env:
          XCODEGEN_URL: https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip
          XCODEGEN_SHA256: 4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806
        run: |
          set -euo pipefail
          ZIP="$RUNNER_TEMP/xcodegen.zip"
          DEST="$RUNNER_TEMP/xcodegen"
          curl --fail --location --proto '=https' --tlsv1.2 "$XCODEGEN_URL" -o "$ZIP"
          printf '%s  %s\n' "$XCODEGEN_SHA256" "$ZIP" | shasum -a 256 -c -
          mkdir -p "$DEST"
          unzip -q "$ZIP" -d "$DEST"
          BIN=$(find "$DEST" -type f -name xcodegen -perm -111 -print -quit)
          [ -n "$BIN" ] || { echo "ERROR: xcodegen executable missing" >&2; exit 1; }
          echo "$(dirname "$BIN")" >> "$GITHUB_PATH"
          "$BIN" --version

      - name: Import Developer ID certificate
        env:
          CERT_P12: ${{ secrets.DEVELOPER_ID_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.DEVELOPER_ID_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PW="$(openssl rand -base64 24)"
          CERT_PATH="$RUNNER_TEMP/devid.p12"
          printf '%s' "$CERT_P12" | base64 --decode > "$CERT_PATH"
          chmod 600 "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security import "$CERT_PATH" -k "$KEYCHAIN" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PW" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | sed 's/"//g')
          rm -f "$CERT_PATH"

      - name: Write notarization API key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
        run: |
          set -euo pipefail
          printf '%s' "$ASC_KEY_P8" | base64 --decode > "$RUNNER_TEMP/asc.p8"
          chmod 600 "$RUNNER_TEMP/asc.p8"

      - name: Build signed and notarized DMG
        env:
          KEY84_ASC_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          KEY84_ASC_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          export KEY84_ASC_KEY_PATH="$RUNNER_TEMP/asc.p8"
          export KEY84_VERSION="${GITHUB_REF_NAME#v}"
          bash tools/package.sh
          DMG="84Key-${GITHUB_REF_NAME}.dmg"
          mv build/84Key.dmg "build/$DMG"
          test ! -e build/dd/Build/Products/Release/84Key.app/Contents/Frameworks/Sparkle.framework
          (
            cd build
            shasum -a 256 "$DMG" > SHA256SUMS
            shasum -a 256 -c SHA256SUMS
          )

      # Destroy credentials before invoking even a pinned artifact helper. If the
      # build fails this still runs; subsequent normal steps remain skipped.
      - name: Clean up signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/build.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/asc.p8" "$RUNNER_TEMP/devid.p12" "$RUNNER_TEMP/xcodegen.zip"

      - name: Upload notarized release payload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: notarized-release
          path: |
            build/84Key-${{ github.ref_name }}.dmg
            build/SHA256SUMS
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish GitHub Release
    needs: build-sign-notarize
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Download notarized payload
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: notarized-release
          path: dist

      - name: Verify payload checksum
        working-directory: dist
        run: shasum -a 256 -c SHA256SUMS

      - name: Publish release payload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            "dist/84Key-${GITHUB_REF_NAME}.dmg" \
            "dist/SHA256SUMS" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag
