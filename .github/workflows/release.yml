name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  preflight:
    name: Verify release source
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Validate tag, main provenance, and source version
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "ERROR: release tag must be strict semver vMAJOR.MINOR.PATCH" >&2
            exit 1
          }
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git fetch --no-tags origin main:refs/remotes/origin/main
          MAIN_SHA="$(git rev-parse refs/remotes/origin/main)"
          test "$MAIN_SHA" = "$GITHUB_SHA" || {
            echo "ERROR: tag points to $GITHUB_SHA, but main is $MAIN_SHA" >&2
            exit 1
          }
          SOURCE_VERSION="$(awk -F'"' '/MARKETING_VERSION:/ { print $2; exit }' platform/macos/project.yml)"
          test "v$SOURCE_VERSION" = "$GITHUB_REF_NAME"

      - name: Run core and security release gate
        run: bash core/tests/run_tests.sh

  build-sign-notarize:
    name: Build, sign & notarize
    needs: preflight
    runs-on: macos-26
    timeout-minutes: 45
    # First release-environment approval authorizes use of Apple credentials.
    environment: release
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Verify exact tag checkout
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Select exact Xcode 26.6 (17F113)
        run: |
          set -euo pipefail
          XCODE=/Applications/Xcode_26.6.app
          test -d "$XCODE" || { echo "ERROR: exact Xcode 26.6 is unavailable" >&2; exit 1; }
          sudo xcode-select -s "$XCODE/Contents/Developer"
          XCODE_VERSION="$(xcodebuild -version | sed -n '1p')"
          XCODE_BUILD="$(xcodebuild -version | sed -n '2p')"
          test "$XCODE_VERSION" = "Xcode 26.6"
          test "$XCODE_BUILD" = "Build version 17F113"
          xcodebuild -version

      - name: Install verified XcodeGen 2.46.0
        env:
          XCODEGEN_URL: https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip
          XCODEGEN_SHA256: 4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806
        run: |
          set -euo pipefail
          ZIP="$RUNNER_TEMP/xcodegen.zip"
          DEST="$RUNNER_TEMP/xcodegen"
          curl --fail --location --proto '=https' --tlsv1.2 "$XCODEGEN_URL" -o "$ZIP"
          printf '%s  %s\n' "$XCODEGEN_SHA256" "$ZIP" | shasum -a 256 -c -
          mkdir -p "$DEST"
          unzip -q "$ZIP" -d "$DEST"
          BIN=$(find "$DEST" -type f -name xcodegen -perm -111 -print -quit)
          [ -n "$BIN" ]
          echo "$(dirname "$BIN")" >> "$GITHUB_PATH"

      - name: Import Developer ID certificate
        env:
          CERT_P12: ${{ secrets.DEVELOPER_ID_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.DEVELOPER_ID_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PW="$(openssl rand -base64 24)"
          CERT_PATH="$RUNNER_TEMP/devid.p12"
          printf '%s' "$CERT_P12" | /usr/bin/base64 -D > "$CERT_PATH"
          chmod 600 "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security import "$CERT_PATH" -k "$KEYCHAIN" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PW" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | sed 's/"//g')
          rm -f "$CERT_PATH"

      - name: Write notarization API key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
        run: |
          set -euo pipefail
          printf '%s' "$ASC_KEY_P8" | /usr/bin/base64 -D > "$RUNNER_TEMP/asc.p8"
          chmod 600 "$RUNNER_TEMP/asc.p8"

      - name: Build signed and notarized universal DMG
        env:
          SANGKEY_ASC_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          SANGKEY_ASC_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          SANGKEY_EXPECTED_TEAM_ID: ${{ secrets.DEVELOPER_ID_TEAM_ID }}
          SANGKEY_REQUIRE_DEVELOPER_ID: '1'
          SANGKEY_ARCHS: 'arm64 x86_64'
          SANGKEY_SOURCE_URL: 'https://github.com/${{ github.repository }}/tree/${{ github.sha }}'
        run: |
          set -euo pipefail
          export SANGKEY_ASC_KEY_PATH="$RUNNER_TEMP/asc.p8"
          export SANGKEY_VERSION="${GITHUB_REF_NAME#v}"
          bash tools/package.sh
          APP="build/dd/Build/Products/Release/SangKey.app"
          BIN="$APP/Contents/MacOS/SangKey"
          AGENT="$APP/Contents/Resources/SangKeyAgent"
          AGENT_PLIST="$APP/Contents/Library/LaunchAgents/com.sangtrx.sangkey.agent.plist"
          COMMON="$APP/Contents/Resources/english_common_cc0.json"
          NOUNS="$APP/Contents/Resources/english_nouns_cc0.json"
          SUPPLEMENT="$APP/Contents/Resources/english_supplement.dat"
          test -x "$AGENT"
          test -f "$AGENT_PLIST"
          test -f "$COMMON"
          test -f "$NOUNS"
          test -f "$SUPPLEMENT"
          test ! -e "$APP/Contents/Resources/english_words.dat"
          test "$(git hash-object "$COMMON")" = '8ec4ea53704dfca63f1ee00852c6bcc15411c49e'
          test "$(git hash-object "$NOUNS")" = 'aca4efb20de9becfd3f949c73e97297be26574f4'
          plutil -lint "$AGENT_PLIST"
          test "$(/usr/libexec/PlistBuddy -c 'Print :BundleProgram' "$AGENT_PLIST")" = 'Contents/Resources/SangKeyAgent'
          lipo "$BIN" -verify_arch arm64 x86_64
          lipo "$AGENT" -verify_arch arm64 x86_64
          if otool -L "$AGENT" | grep -Eqi 'AppKit|SwiftUI|Combine|/libswift|ServiceManagement'; then
            echo "ERROR: release agent linked UI/Swift/login-item machinery" >&2
            exit 1
          fi
          codesign --verify --strict --verbose=2 "$AGENT"
          test "$(codesign -d --verbose=4 "$AGENT" 2>&1 | awk -F= '/^Identifier=/{print $2; exit}')" = 'com.sangtrx.sangkey.agent'
          test "$(codesign -d --verbose=4 "$AGENT" 2>&1 | awk -F= '/^TeamIdentifier=/{print $2; exit}')" = "$SANGKEY_EXPECTED_TEAM_ID"
          test "$(codesign -d --verbose=4 "$APP" 2>&1 | awk -F= '/^TeamIdentifier=/{print $2; exit}')" = "$SANGKEY_EXPECTED_TEAM_ID"
          codesign --verify --deep --strict --verbose=2 "$APP"
          DMG="SangKey-${GITHUB_REF_NAME}.dmg"
          mv build/SangKey.dmg "build/$DMG"
          test ! -e "$APP/Contents/Frameworks/Sparkle.framework"
          test ! -e "$APP/Contents/Resources/EngineUpstream.inc"

          MOUNT="$RUNNER_TEMP/sangkey-release-mount"
          mkdir -p "$MOUNT"
          hdiutil attach "build/$DMG" -nobrowse -readonly -mountpoint "$MOUNT" >/dev/null
          trap 'hdiutil detach "$MOUNT" >/dev/null 2>&1 || true' EXIT
          MOUNT_APP="$MOUNT/SangKey.app"
          test -d "$MOUNT_APP"
          test -f "$MOUNT/LICENSE.txt"
          test -f "$MOUNT/NOTICE.txt"
          test -f "$MOUNT/THIRD_PARTY_DATA.txt"
          test -f "$MOUNT/SOURCE.txt"
          grep -q '8ec4ea53704dfca63f1ee00852c6bcc15411c49e' "$MOUNT/THIRD_PARTY_DATA.txt"
          grep -q 'aca4efb20de9becfd3f949c73e97297be26574f4' "$MOUNT/THIRD_PARTY_DATA.txt"
          grep -Fxq "$SANGKEY_SOURCE_URL" "$MOUNT/SOURCE.txt"
          test -f "$MOUNT_APP/Contents/Resources/english_common_cc0.json"
          test -f "$MOUNT_APP/Contents/Resources/english_nouns_cc0.json"
          test -f "$MOUNT_APP/Contents/Resources/english_supplement.dat"
          test ! -e "$MOUNT_APP/Contents/Resources/english_words.dat"
          test "$(git hash-object "$MOUNT_APP/Contents/Resources/english_common_cc0.json")" = '8ec4ea53704dfca63f1ee00852c6bcc15411c49e'
          test "$(git hash-object "$MOUNT_APP/Contents/Resources/english_nouns_cc0.json")" = 'aca4efb20de9becfd3f949c73e97297be26574f4'
          codesign --verify --deep --strict --verbose=2 "$MOUNT_APP"
          spctl -a -vv --type execute "$MOUNT_APP"
          hdiutil detach "$MOUNT" >/dev/null
          trap - EXIT

          spctl -a -t open --context context:primary-signature "build/$DMG"
          (
            cd build
            shasum -a 256 "$DMG" > SHA256SUMS
            shasum -a 256 -c SHA256SUMS
          )

      - name: Clean up signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/build.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/asc.p8" "$RUNNER_TEMP/devid.p12" "$RUNNER_TEMP/xcodegen.zip"

      - name: Upload notarized release payload
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6, Node 24
        with:
          name: notarized-release
          path: |
            build/SangKey-${{ github.ref_name }}.dmg
            build/SHA256SUMS
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish GitHub Release
    needs: build-sign-notarize
    runs-on: ubuntu-24.04
    # Second approval on the same release environment is intentional: after
    # build-sign-notarize uploads the notarized artifact, test that exact DMG on
    # a clean Mac (SMAppService, Accessibility, close/relogin, disable/enable)
    # before approving this public-publish job.
    environment: release
    permissions:
      contents: write
    steps:
      - name: Download notarized payload
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7, Node 24
        with:
          name: notarized-release
          path: dist

      - name: Verify payload checksum
        working-directory: dist
        run: shasum -a 256 -c SHA256SUMS

      - name: Publish release payload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            "dist/SangKey-${GITHUB_REF_NAME}.dmg" \
            "dist/SHA256SUMS" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag
