name: SangKey
options:
  bundleIdPrefix: com.sangtrx
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    CLANG_CXX_LANGUAGE_STANDARD: "c++14"
    CLANG_CXX_LIBRARY: "libc++"
    CLANG_ENABLE_OBJC_ARC: YES
    SWIFT_VERSION: "5.0"

targets:
  SangKey:
    type: application
    platform: macOS
    sources:
      - path: App
        # Legacy SwiftUI implementation is kept in git history/reference only.
        # The shipping app is pure AppKit + Foundation on the Swift side.
        excludes:
          - Key84App.swift
          - OnboardingView.swift
          - SettingsView.swift
          - Settings
          - DesignSystem
      - path: Input
      - path: Bridge
      - path: ../../core/engine
        name: Engine
        excludes:
          - EngineUpstream.inc
      - path: ../../core/data/english_words.dat
        buildPhase: resources
      - path: ../../core/data/viet_telex.dat
        buildPhase: resources
      - path: Resources/Assets.xcassets
        buildPhase: resources
    dependencies:
      - sdk: Carbon.framework
      - sdk: ServiceManagement.framework
    settings:
      base:
        PRODUCT_NAME: "SangKey"
        PRODUCT_MODULE_NAME: "SangKey"
        PRODUCT_BUNDLE_IDENTIFIER: com.sangtrx.sangkey
        INFOPLIST_FILE: Resources/Info.plist
        SWIFT_OBJC_BRIDGING_HEADER: Bridge/Key84-Bridging-Header.h
        MARKETING_VERSION: "0.3.0"
        CURRENT_PROJECT_VERSION: "13"
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        HEADER_SEARCH_PATHS:
          - "$(SRCROOT)/Input"
          - "$(SRCROOT)/Bridge"
          - "$(SRCROOT)/../../core/engine"
      configs:
        Debug:
          PRODUCT_NAME: "SangKey (DEV)"
          PRODUCT_BUNDLE_IDENTIFIER: com.sangtrx.sangkey.debug
          ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon-Dev

schemes:
  SangKey:
    build:
      targets:
        SangKey: all
    run:
      config: Debug
    test:
      config: Debug
