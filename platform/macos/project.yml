name: SangKey
options:
  bundleIdPrefix: com.sangtrx
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    CLANG_CXX_LANGUAGE_STANDARD: "c++14"
    CLANG_CXX_LIBRARY: "libc++"
    CLANG_ENABLE_OBJC_ARC: YES

targets:
  SangKey:
    type: application
    platform: macOS
    sources:
      # Absolute-minimum macOS host: one Objective-C++ AppKit status-menu entry
      # point plus the Objective-C++ event tap. No Swift/SwiftUI/Combine target.
      - path: App/SangKeyApp.mm
      - path: Input
      - path: ../../core/engine
        name: Engine
        excludes:
          - EngineUpstream.inc
      - path: ../../core/data/english_words.dat
        buildPhase: resources
      - path: ../../core/data/viet_telex.dat
        buildPhase: resources
      - path: Resources/Assets.xcassets
        buildPhase: resources
    dependencies:
      - sdk: AppKit.framework
      - sdk: ApplicationServices.framework
      - sdk: Carbon.framework
    settings:
      base:
        PRODUCT_NAME: "SangKey"
        PRODUCT_BUNDLE_IDENTIFIER: com.sangtrx.sangkey
        INFOPLIST_FILE: Resources/Info.plist
        MARKETING_VERSION: "0.3.0"
        CURRENT_PROJECT_VERSION: "13"
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: NO
        HEADER_SEARCH_PATHS:
          - "$(SRCROOT)/Input"
          - "$(SRCROOT)/../../core/engine"
      configs:
        Debug:
          PRODUCT_NAME: "SangKey (DEV)"
          PRODUCT_BUNDLE_IDENTIFIER: com.sangtrx.sangkey.debug
          ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon-Dev

schemes:
  SangKey:
    build:
      targets:
        SangKey: all
    run:
      config: Debug
    test:
      config: Debug
