name: SangKey
options:
  bundleIdPrefix: com.sangtrx
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    CLANG_CXX_LANGUAGE_STANDARD: "c++14"
    CLANG_CXX_LIBRARY: "libc++"
    CLANG_ENABLE_OBJC_ARC: YES

targets:
  SangKeyAgent:
    type: tool
    platform: macOS
    sources:
      - path: Agent/SangKeyAgent.mm
      - path: HeadlessCompat/AppKitCompat.mm
      - path: Shared/SangKeyPreferences.mm
      - path: Input
      - path: ../../core/engine
        name: Engine
        excludes:
          - EngineUpstream.inc
    dependencies:
      - sdk: Foundation.framework
      - sdk: ApplicationServices.framework
      - sdk: Carbon.framework
      - sdk: Security.framework
    settings:
      base:
        PRODUCT_NAME: "SangKeyAgent"
        PRODUCT_BUNDLE_IDENTIFIER: com.sangtrx.sangkey.agent
        ENABLE_HARDENED_RUNTIME: YES
        HEADER_SEARCH_PATHS:
          # Must precede SDK framework headers. InputController.mm's inherited
          # <Cocoa/Cocoa.h> import resolves to the narrow no-AppKit adapter.
          - "$(SRCROOT)/HeadlessCompat"
          - "$(SRCROOT)/Shared"
          - "$(SRCROOT)/Input"
          - "$(SRCROOT)/../../core/engine"

  SangKey:
    type: application
    platform: macOS
    sources:
      - path: App/SangKeyApp.mm
      - path: Shared/SangKeyPreferences.mm
      - path: ../../core/data/english_common_cc0.json
        buildPhase: resources
      - path: ../../core/data/english_nouns_cc0.json
        buildPhase: resources
      - path: ../../core/data/english_supplement.dat
        buildPhase: resources
      - path: ../../core/data/viet_telex.dat
        buildPhase: resources
      - path: Resources/Assets.xcassets
        buildPhase: resources
    dependencies:
      - sdk: AppKit.framework
      - sdk: ServiceManagement.framework
      # XcodeGen copies tool dependencies into Contents/Resources automatically.
      - target: SangKeyAgent
        link: false
    postBuildScripts:
      - name: Embed bundled LaunchAgent descriptor
        basedOnDependencyAnalysis: false
        inputFiles:
          - "$(SRCROOT)/Agent/com.sangtrx.sangkey.agent.plist"
        outputFiles:
          - "$(TARGET_BUILD_DIR)/$(CONTENTS_FOLDER_PATH)/Library/LaunchAgents/com.sangtrx.sangkey.agent.plist"
        script: |
          set -euo pipefail
          LAUNCH_AGENTS="$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/Library/LaunchAgents"
          mkdir -p "$LAUNCH_AGENTS"
          install -m 644 "$SRCROOT/Agent/com.sangtrx.sangkey.agent.plist" \
            "$LAUNCH_AGENTS/com.sangtrx.sangkey.agent.plist"
    settings:
      base:
        PRODUCT_NAME: "SangKey"
        PRODUCT_MODULE_NAME: "SangKey"
        PRODUCT_BUNDLE_IDENTIFIER: com.sangtrx.sangkey
        INFOPLIST_FILE: Resources/Info.plist
        MARKETING_VERSION: "0.4.0"
        CURRENT_PROJECT_VERSION: "14"
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: NO
        HEADER_SEARCH_PATHS:
          - "$(SRCROOT)/Shared"
      configs:
        Debug:
          PRODUCT_NAME: "SangKey (DEV)"
          PRODUCT_BUNDLE_IDENTIFIER: com.sangtrx.sangkey.debug
          ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon-Dev

schemes:
  SangKey:
    build:
      targets:
        SangKey: all
    run:
      config: Debug
    test:
      config: Debug
